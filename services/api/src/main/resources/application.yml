spring:
  application:
    name: community-elderly-api
  profiles:
    default: local
  servlet:
    multipart:
      # Transport headroom lets the domain validator audit the 5 MB rejection boundary.
      max-file-size: 6MB
      max-request-size: 7MB
  jackson:
    time-zone: Asia/Shanghai

server:
  address: 127.0.0.1
  port: 8080

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      probes:
        enabled: true

mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true
