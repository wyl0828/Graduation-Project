spring:
  application:
    name: community-elderly-api
  profiles:
    default: local
  jackson:
    time-zone: Asia/Shanghai

server:
  address: 127.0.0.1
  port: 8080

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      probes:
        enabled: true

mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true
